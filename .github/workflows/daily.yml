name: 매일 오전 7시 어린이집 데이터 수집

on:
  schedule:
    # GitHub는 UTC 기준으로 돕니다. 한국 오전 7시 = UTC 22시 (전날)
    - cron: '0 22 * * *'
  workflow_dispatch:        # 버튼을 눌러 바로 돌려볼 수도 있습니다

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 내려받기
        uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 데이터 수집
        env:
          CHILDCARE_KEY: ${{ secrets.CHILDCARE_KEY }}
        run: node collect.js

      - name: 바뀐 내용 저장
        run: |
          git config user.name  "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "바뀐 내용이 없습니다"
          else
            git commit -m "데이터 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi
